# Non-official Nginx hardening snippet for Dolibarr behind reverse proxy
# Include this in your server block after SSL config. Validate in staging first.

# TLS
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256';
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# HSTS (enable only after confirming HTTPS works across subdomains if desired)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Deny access to sensitive files
location ~* \.(?:ini|log|bak|sql|sh)$ { deny all; }
location ~* /(?:\.git|\.svn|\.hg)/ { deny all; }

# Disable script execution in upload dirs
location ^~ /documents/ { 
    autoindex off;
    types { }
    default_type application/octet-stream;
    try_files $uri =404;
}

# Rate limiting (tune values per environment)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
location ~* /api/ { 
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://phpfpm_upstream;
}
