Backup of docker-compose.yml before HTTPS changes.

---

```
services:
  web:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../htdocs:/var/www/html
      - dolibarr_documents:/var/www/html/documents
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../htdocs:/var/www/html
      - dolibarr_documents:/var/www/html/documents
      # Let Dolibarr create/manage conf/conf.php on first install
    environment:
      - PHP_INI_DIR=/usr/local/etc/php
    depends_on:
      - db

  db:
    image: mariadb:10.11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarrpass
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mariadb_data:
  dolibarr_documents:
```
