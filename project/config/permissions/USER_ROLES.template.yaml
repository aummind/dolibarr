# Fill this matrix once roles are finalized. This will map to Dolibarr groups and rights.
# Non-official template. Validate module codes in official Dolibarr docs.

roles:
  production_manager:
    description: Full production module access, batch records, planning
    modules:
      mrp: { read: true, write: true, validate: true, admin: false }
      bom: { read: true, write: true, validate: true, admin: false }
      stock: { read: true, write: true, validate: true, admin: false }
      ecm: { read: true, write: true, validate: true, admin: false }
  production_supervisor:
    description: Batch record review, daily operations
    modules:
      mrp: { read: true, write: true, validate: true, admin: false }
      stock: { read: true, write: true, validate: true, admin: false }
  production_operator:
    description: Data entry, process execution, equipment logs
    modules:
      mrp: { read: true, write: true, validate: false, admin: false }
      stock: { read: true, write: true, validate: false, admin: false }
  qc_manager:
    description: Method validation, compliance oversight, audit management
    modules:
      product: { read: true, write: true, validate: true, admin: false }
      ecm: { read: true, write: true, validate: true, admin: false }
  qc_analyst:
    description: Test execution, results, instrument calibration
    modules:
      product: { read: true, write: true, validate: false, admin: false }
      ecm: { read: true, write: true, validate: false, admin: false }
  store_manager:
    description: Inventory control, issuance, storage conditions
    modules:
      stock: { read: true, write: true, validate: true, admin: false }
  store_keeper:
    description: Daily transactions, stock counting, material handling
    modules:
      stock: { read: true, write: true, validate: false, admin: false }
  ehs_officer:
    description: ISO 14001 compliance, waste management, incident reporting
    modules:
      ecm: { read: true, write: true, validate: true, admin: false }
  rd_manager:
    description: Research project management, formula development
    modules:
      project: { read: true, write: true, validate: true, admin: false }
      product: { read: true, write: true, validate: true, admin: false }
  research_scientist:
    description: Experiments, data recording, analysis
    modules:
      project: { read: true, write: true, validate: false, admin: false }
      product: { read: true, write: true, validate: false, admin: false }
  hr_manager:
    description: Employee records, payroll, compliance
    modules:
      hrm: { read: true, write: true, validate: true, admin: false }
  hr_executive:
    description: Recruitment, onboarding, statutory compliance
    modules:
      hrm: { read: true, write: true, validate: false, admin: false }

# Note: Map these to actual Dolibarr rights IDs in your setup scripts/migrations.
